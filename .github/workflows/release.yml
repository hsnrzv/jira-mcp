name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
          fi

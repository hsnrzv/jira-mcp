<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8BFF"/>
      <stop offset="0.55" stop-color="#0B5BD3"/>
      <stop offset="1" stop-color="#062F7A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC8FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FE7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7FE7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00163D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS-style rounded tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Diamond split into two chevrons: a nod to Jira's tilted tiles and to code brackets -->
  <g fill="none" stroke="url(#mark)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round">
    <path d="M462 268 L218 512 L462 756"/>
    <path d="M562 268 L806 512 L562 756"/>
  </g>

  <!-- MCP hub: connected nodes -->
  <circle cx="512" cy="512" r="190" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="392"/>
    <line x1="512" y1="512" x2="408" y2="572"/>
    <line x1="512" y1="512" x2="616" y2="572"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="512" cy="392" r="30"/>
    <circle cx="408" cy="572" r="30"/>
    <circle cx="616" cy="572" r="30"/>
  </g>
  <circle cx="512" cy="512" r="52" fill="#0B5BD3" stroke="#FFFFFF" stroke-width="20"/>

  <!-- AI sparkle -->
  <g fill="#FFFFFF">
    <path d="M760 166 C770 222 786 238 842 248 C786 258 770 274 760 330 C750 274 734 258 678 248 C734 238 750 222 760 166 Z"/>
    <path d="M860 318 C864 340 870 346 892 350 C870 354 864 360 860 382 C856 360 850 354 828 350 C850 346 856 340 860 318 Z" fill-opacity="0.85"/>
  </g>
</svg>
